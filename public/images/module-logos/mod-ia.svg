<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae8ff" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="40.1%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#030712" rx="32" />
  <circle cx="100" cy="100" r="75" fill="url(#centerGlow)" />
  
  <!-- Outer Hexagon Border -->
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="url(#hexGrad)" stroke-width="0.8" opacity="0.3" filter="url(#glow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="2.5" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#glassGrad)" />
  <polygon points="100,28 163,64 163,136 100,172 37,136 37,64" fill="none" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.2" />
  
  <!-- Icon: Cyber Neural Brain (IA) -->
  <g transform="translate(10, 10)">
    <path d="M 90,45 C 110,45 125,60 125,80 C 125,90 118,100 110,105 C 110,115 100,125 90,125 C 80,125 70,115 70,105 C 62,100 55,90 55,80 C 55,60 70,45 90,45 Z" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linejoin="round" filter="url(#softGlow)" />
    
    <!-- Central circuit lines -->
    <path d="M 90,45 V 125 M 70,80 H 110" stroke="url(#iconGrad)" stroke-width="3" opacity="0.4" />
    <circle cx="90" cy="45" r="3.5" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="90" cy="125" r="3.5" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="55" cy="80" r="3.5" fill="#FFFFFF" filter="url(#softGlow)" />
    <circle cx="125" cy="80" r="3.5" fill="#FFFFFF" filter="url(#softGlow)" />
  </g>
  
  <!-- Concentric Dot -->
  <circle cx="85" cy="100" r="12" fill="#FFFFFF" opacity="0.1" />
  <circle cx="85" cy="100" r="8" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="85" cy="100" r="4" fill="#c084fc" filter="url(#softGlow)" />
</svg>
