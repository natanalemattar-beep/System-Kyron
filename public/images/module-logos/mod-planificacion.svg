<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#030712" rx="32" />
  <circle cx="100" cy="100" r="70" fill="url(#centerGlow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="url(#hexGrad)" stroke-width="0.8" opacity="0.3" filter="url(#glow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="3" />
  <polygon points="100,28 163,64 163,136 100,172 37,136 37,64" fill="none" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.35" />
  <circle cx="78" cy="65" r="5" fill="url(#iconGrad)" />
  <circle cx="78" cy="100" r="5" fill="url(#iconGrad)" />
  <circle cx="78" cy="135" r="5" fill="url(#iconGrad)" />
  <line x1="83" y1="65" x2="140" y2="65" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <line x1="83" y1="100" x2="155" y2="100" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.35" />
  <line x1="83" y1="135" x2="120" y2="135" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 78,55 L 95,65 L 78,75" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  <path d="M 78,90 L 95,100 L 78,110" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  <path d="M 78,125 L 95,135 L 78,145" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />
  <circle cx="100" cy="96" r="13" fill="#FFFFFF" opacity="0.12" />
  <circle cx="100" cy="96" r="9" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="100" cy="96" r="4.5" fill="#fb923c" filter="url(#softGlow)" />
</svg>