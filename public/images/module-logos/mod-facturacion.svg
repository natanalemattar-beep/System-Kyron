<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070f1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#99f6e4" />
    </linearGradient>
  </defs>

  <!-- Dark Deep Blue Background -->
  <rect width="100%" height="100%" fill="#070f1e" />
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Ring of Glowing Dots -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="2, 4.5" opacity="0.4" filter="url(#glow)" />
  
  <!-- Outer Solid Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#2dd4bf" stroke-width="0.5" opacity="0.2" />

  <!-- Main Inner Disk -->
  <circle cx="100" cy="100" r="66" fill="url(#diskGrad)" stroke="#0d9488" stroke-width="1.5" />
  
  <!-- Inner Concentric Dial Ring -->
  <circle cx="100" cy="100" r="61" fill="none" stroke="#2dd4bf" stroke-width="0.5" opacity="0.15" />

  <!-- Top Text: Module Name -->
  <text x="100" y="70" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="5.5" font-weight="900" letter-spacing="1.5" fill="#99f6e4" opacity="0.85">• — FACTURACIÓN — •</text>

  <!-- Central Icon: Official Facturacion Receipt -->
  <g transform="translate(0, 5)">
    <!-- Document outline with fold -->
    <rect x="85" y="85" width="30" height="38" rx="3" fill="none" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Horizontal text lines inside -->
    <line x1="93" y1="95" x2="107" y2="95" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <line x1="93" y1="104" x2="107" y2="104" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    <line x1="93" y1="113" x2="101" y2="113" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.55" />
    <!-- Small Upward Arrow/Triangle overlay -->
    <polygon points="107,110 115,110 111,104" fill="url(#iconGrad)" />
  </g>

  <!-- Bottom Subtitle -->
  <text x="100" y="132" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="3.5" font-weight="bold" letter-spacing="1" fill="#2dd4bf" opacity="0.6">SYSTEM KYRON</text>
</svg>
