<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#c026d3" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="50%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d946ef" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="40.1%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#030712" rx="32" />
  <circle cx="100" cy="100" r="70" fill="url(#centerGlow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="url(#hexGrad)" stroke-width="0.8" opacity="0.3" filter="url(#glow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="3" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#glassGrad)" />
  <polygon points="100,28 163,64 163,136 100,172 37,136 37,64" fill="none" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.35" />
  
  <!-- Megaphone/Broadcasting Horn (Marketing) -->
  <path d="M 65,115 L 85,115 L 115,135 V 65 L 85,85 L 65,85 Z" fill="none" stroke="url(#iconGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#softGlow)" />
  <path d="M 65,85 V 115" stroke="url(#iconGrad)" stroke-width="6" />
  <path d="M 75,115 L 75,130 L 85,125" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linejoin="round" />
  
  <!-- Expanding Waves -->
  <path d="M 128,85 A 20,20 0 0 1 128,115" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" filter="url(#softGlow)" />
  <path d="M 138,75 A 35,38 0 0 1 138,125" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.7" filter="url(#softGlow)" />
  <path d="M 148,65 A 50,54 0 0 1 148,135" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.5" filter="url(#softGlow)" />
  
  <!-- Concentric Circle dot -->
  <circle cx="85" cy="100" r="13" fill="#FFFFFF" opacity="0.12" />
  <circle cx="85" cy="100" r="9" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="85" cy="100" r="4.5" fill="#e879f9" filter="url(#softGlow)" />
</svg>
