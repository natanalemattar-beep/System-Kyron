<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="40.1%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#030712" rx="32" />
  <circle cx="100" cy="100" r="70" fill="url(#centerGlow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="url(#hexGrad)" stroke-width="0.8" opacity="0.3" filter="url(#glow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="3" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#glassGrad)" />
  <polygon points="100,28 163,64 163,136 100,172 37,136 37,64" fill="none" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.35" />
  
  <!-- Smartphone Outline & Signal (Líneas Personal) -->
  <rect x="80" y="60" width="40" height="80" rx="6" fill="none" stroke="url(#iconGrad)" stroke-width="6" filter="url(#softGlow)" />
  <circle cx="100" cy="130" r="4" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Signal Waves radiating from phone -->
  <path d="M 87,50 A 15,15 0 0 1 113,50" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" opacity="0.9" />
  <path d="M 77,42 A 30,30 0 0 1 123,42" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" opacity="0.7" />
  <path d="M 67,34 A 45,45 0 0 1 133,34" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" opacity="0.5" />
  
  <!-- User Silhouette inside phone -->
  <circle cx="100" cy="85" r="7" fill="#FFFFFF" opacity="0.8" />
  <path d="M 88,105 C 88,97 112,97 112,105" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Concentric Circle dot -->
  <circle cx="85" cy="100" r="13" fill="#FFFFFF" opacity="0.12" />
  <circle cx="85" cy="100" r="9" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="85" cy="100" r="4.5" fill="#2dd4bf" filter="url(#softGlow)" />
</svg>
