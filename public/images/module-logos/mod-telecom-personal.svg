<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070f1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
  </defs>

  <!-- Dark Deep Blue Background -->
  <rect width="100%" height="100%" fill="#070f1e" />
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Ring of Glowing Dots -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="2, 4.5" opacity="0.4" filter="url(#glow)" />
  
  <!-- Outer Solid Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.2" />

  <!-- Main Inner Disk -->
  <circle cx="100" cy="100" r="66" fill="url(#diskGrad)" stroke="#1e3a8a" stroke-width="1.5" />
  
  <!-- Inner Concentric Dial Ring -->
  <circle cx="100" cy="100" r="61" fill="none" stroke="#60a5fa" stroke-width="0.5" opacity="0.15" />

  <!-- Top Text: Module Name -->
  <text x="100" y="70" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="5.5" font-weight="900" letter-spacing="1.5" fill="#93c5fd" opacity="0.85">• — LÍNEAS PERSONAL — •</text>

  <!-- Central Icon: Personal Line (Líneas Personal) -->
  <g transform="translate(0, 5)">
    <!-- Avatar Head -->
    <circle cx="100" cy="85" r="7" fill="url(#iconGrad)" />
    <!-- Avatar Shoulders -->
    <path d="M 88,103 C 88,96 112,96 112,103 Z" fill="url(#iconGrad)" />
    
    <!-- 3 Horizontal Lines -->
    <line x1="82" y1="108" x2="118" y2="108" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.9" />
    <line x1="82" y1="114" x2="118" y2="114" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <line x1="82" y1="120" x2="118" y2="120" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.55" />
    
    <!-- Small Connected Node (Dot) -->
    <circle cx="92" cy="120" r="4.5" fill="url(#iconGrad)" filter="url(#softGlow)" />
  </g>

  <!-- Bottom Subtitle -->
  <text x="100" y="132" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="3.5" font-weight="bold" letter-spacing="1" fill="#60a5fa" opacity="0.6">SYSTEM KYRON</text>
</svg>
