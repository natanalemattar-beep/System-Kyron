<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070f1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>

  <!-- Dark Deep Blue Background -->
  <rect width="100%" height="100%" fill="#070f1e" />
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Ring of Glowing Dots -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="2, 4.5" opacity="0.4" filter="url(#glow)" />
  
  <!-- Outer Solid Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.2" />

  <!-- Main Inner Disk -->
  <circle cx="100" cy="100" r="66" fill="url(#diskGrad)" stroke="#0369a1" stroke-width="1.5" />
  
  <!-- Inner Concentric Dial Ring -->
  <circle cx="100" cy="100" r="61" fill="none" stroke="#0ea5e9" stroke-width="0.5" opacity="0.15" />

  <!-- Top Text: Module Name -->
  <text x="100" y="70" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="5.5" font-weight="900" letter-spacing="1.5" fill="#bae6fd" opacity="0.85">• — PORTAL CIUDADANO — •</text>

  <!-- Central Icon: Simplified Civic Portal -->
  <g transform="translate(0, 5)">
    <path d="M 70,120 V 90 L 100,70 L 130,90 V 120 Z" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linejoin="round" />
    <rect x="80" y="90" width="8" height="30" fill="url(#iconGrad)" />
    <rect x="112" y="90" width="8" height="30" fill="url(#iconGrad)" />
    <!-- Rounded arch -->
    <path d="M 80,90 V 80 A 20,20 0 0 1 120,80 V 90" fill="none" stroke="url(#iconGrad)" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Bottom Subtitle -->
  <text x="100" y="132" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="3.5" font-weight="bold" letter-spacing="1" fill="#0ea5e9" opacity="0.6">SYSTEM KYRON</text>
</svg>
