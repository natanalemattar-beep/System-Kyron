<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070f1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
  </defs>

  <!-- Dark Deep Blue Background -->
  <rect width="100%" height="100%" fill="#070f1e" />
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Ring of Glowing Dots -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2, 4.5" opacity="0.4" filter="url(#glow)" />
  
  <!-- Outer Solid Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#c084fc" stroke-width="0.5" opacity="0.2" />

  <!-- Main Inner Disk -->
  <circle cx="100" cy="100" r="66" fill="url(#diskGrad)" stroke="#6d28d9" stroke-width="1.5" />
  
  <!-- Inner Concentric Dial Ring -->
  <circle cx="100" cy="100" r="61" fill="none" stroke="#c084fc" stroke-width="0.5" opacity="0.15" />

  <!-- Top Text: Module Name -->
  <text x="100" y="70" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="5.5" font-weight="900" letter-spacing="1.5" fill="#ddd6fe" opacity="0.85">• — NÓMINA & RRHH — •</text>

  <!-- Central Icon: Team of 3 (Nómina & RRHH) -->
  <g transform="translate(0, 5)">
    <!-- Center Person (Large) -->
    <circle cx="100" cy="91" r="7" fill="url(#iconGrad)" />
    <path d="M 85,115 C 85,102 115,102 115,115 Z" fill="url(#iconGrad)" />
    
    <!-- Left Person (Medium) -->
    <circle cx="86" cy="95" r="5.5" fill="#ffffff" opacity="0.75" />
    <path d="M 74,115 C 74,105 94,105 94,115 Z" fill="#ffffff" opacity="0.75" />
    
    <!-- Right Person (Medium) -->
    <circle cx="114" cy="95" r="5.5" fill="#ffffff" opacity="0.75" />
    <path d="M 106,115 C 106,105 126,105 126,115 Z" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Bottom Subtitle -->
  <text x="100" y="132" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="3.5" font-weight="bold" letter-spacing="1" fill="#c084fc" opacity="0.6">SYSTEM KYRON</text>
</svg>
