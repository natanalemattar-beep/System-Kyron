<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070f1e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="diskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Dark Deep Blue Background -->
  <rect width="100%" height="100%" fill="#070f1e" />
  <circle cx="100" cy="100" r="90" fill="url(#bgGlow)" />

  <!-- Outer Ring of Glowing Dots -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="2, 4.5" opacity="0.4" filter="url(#glow)" />
  
  <!-- Outer Solid Ring -->
  <circle cx="100" cy="100" r="72" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.2" />

  <!-- Main Inner Disk -->
  <circle cx="100" cy="100" r="66" fill="url(#diskGrad)" stroke="#1e1b4b" stroke-width="1.5" />
  
  <!-- Inner Concentric Dial Ring -->
  <circle cx="100" cy="100" r="61" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.15" />

  <!-- Top Text: Module Name -->
  <text x="100" y="70" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="5.5" font-weight="900" letter-spacing="1.5" fill="#fde68a" opacity="0.85">• — LEGAL — •</text>

  <!-- Central Icon: Scales of Justice (Legal) -->
  <g transform="translate(0, 5)">
    <!-- Central Stem -->
    <line x1="100" y1="80" x2="100" y2="116" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="90" y1="116" x2="110" y2="116" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Balance Beam -->
    <line x1="75" y1="88" x2="125" y2="88" stroke="url(#iconGrad)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Left Hanging Plate -->
    <path d="M 75,88 L 65,108 H 85 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" opacity="0.9" />
    
    <!-- Right Hanging Plate -->
    <path d="M 125,88 L 115,108 H 135 Z" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Bottom Subtitle -->
  <text x="100" y="132" text-anchor="middle" font-family="'Inter', 'Segoe UI', Arial" font-size="3.5" font-weight="bold" letter-spacing="1" fill="#fbbf24" opacity="0.6">SYSTEM KYRON</text>
</svg>
