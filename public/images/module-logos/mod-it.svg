<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="40.1%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#030712" rx="32" />
  <circle cx="100" cy="100" r="70" fill="url(#centerGlow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="none" stroke="url(#hexGrad)" stroke-width="0.8" opacity="0.3" filter="url(#glow)" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#hexFill)" stroke="url(#hexGrad)" stroke-width="3" />
  <polygon points="100,20 169.3,60 169.3,140 100,180 30.7,140 30.7,60" fill="url(#glassGrad)" />
  <polygon points="100,28 163,64 163,136 100,172 37,136 37,64" fill="none" stroke="url(#hexGrad)" stroke-width="0.5" opacity="0.35" />
  
  <!-- Glowing Microchip/Circuit (Informatica IT) -->
  <rect x="75" y="75" width="50" height="50" rx="6" fill="none" stroke="url(#iconGrad)" stroke-width="6" filter="url(#softGlow)" />
  <rect x="87" y="87" width="26" height="26" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.85" />
  
  <!-- Radiating circuit connection tracks -->
  <line x1="75" y1="85" x2="60" y2="85" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="75" y1="100" x2="60" y2="100" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="75" y1="115" x2="60" y2="115" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="125" y1="85" x2="140" y2="85" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="125" y1="100" x2="140" y2="100" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
  <line x1="125" y1="115" x2="140" y2="115" stroke="url(#iconGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Nodes at ends of circuits -->
  <circle cx="60" cy="100" r="4.5" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="140" cy="100" r="4.5" fill="#FFFFFF" filter="url(#softGlow)" />
  
  <!-- Concentric Circle dot -->
  <circle cx="85" cy="100" r="13" fill="#FFFFFF" opacity="0.12" />
  <circle cx="85" cy="100" r="9" fill="#FFFFFF" filter="url(#softGlow)" />
  <circle cx="85" cy="100" r="4.5" fill="#818cf8" filter="url(#softGlow)" />
</svg>
